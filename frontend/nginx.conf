server {
    listen 80;
    server_name selections.pk www.selections.pk;
    return 301 https://selections.pk$request_uri;
}

server {
    listen 443 ssl;
    server_name www.selections.pk;
    ssl_certificate     /etc/letsencrypt/live/selections.pk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/selections.pk/privkey.pem;
    return 301 https://selections.pk$request_uri;
}

server {
    listen 443 ssl;
    server_name selections.pk;

    ssl_certificate     /etc/letsencrypt/live/selections.pk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/selections.pk/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;

    client_max_body_size 20M;

    # Security headers
    add_header X-Frame-Options        "SAMEORIGIN"                      always;
    add_header X-Content-Type-Options "nosniff"                         always;
    add_header X-XSS-Protection       "1; mode=block"                   always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ── React SPA ───────────────────────────────────────────────────────────
    root  /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache content-hashed assets (Vite output)
    location ~* \.(js|css|woff2?|ttf|eot|svg|ico|png|jpg|jpeg|gif|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── SEO: Dynamic sitemap and robots.txt from Django ─────────────────────
    location = /sitemap.xml {
        proxy_pass         http://backend:8000/sitemap.xml;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        add_header         Cache-Control "public, max-age=3600";
    }

    location = /robots.txt {
        proxy_pass         http://backend:8000/robots.txt;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        add_header         Cache-Control "public, max-age=86400";
    }

    # IndexNow key file verification
    location ~* ^/[a-zA-Z0-9\-]+\.txt$ {
        proxy_pass         http://backend:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        add_header         Cache-Control "public, max-age=86400";
    }

    # ── Backend: REST API + Swagger + Django Admin ───────────────────────────
    location /api/ {
        proxy_pass         http://backend:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /admin/ {
        proxy_pass         http://backend:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Django static files
    location /static/ {
        proxy_pass       http://backend:8000;
        proxy_set_header Host $host;
        expires          30d;
        add_header       Cache-Control "public, immutable";
    }

    # ── Media files ─────────────────────────────────────────────────────────
    location /media/ {
        alias   /app/media/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # ── Gzip ────────────────────────────────────────────────────────────────
    gzip            on;
    gzip_vary       on;
    gzip_min_length 1024;
    gzip_proxied    any;
    gzip_comp_level 6;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/json application/javascript application/xml+rss
        application/atom+xml image/svg+xml;
}
